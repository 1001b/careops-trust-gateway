version: 2

models:
  - name: silver_providers
    description: Provider dimension. Primary key provider_id. Dimension attribute state.
    columns:
      - name: provider_id
        tests: [not_null, unique]
      - name: state
        tests: [not_null]
      - name: active_from
        tests: [not_null]

  - name: silver_provider_networks
    description: >
      Network participation dimension. Grain is provider_id + payer_network + effective_from.
      provider_id is not unique: P003 has two effective-dated Aetna rows, and gold must not multiply slots by that.
    columns:
      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_providers')
                field: provider_id
      - name: payer_network
        tests: [not_null]
      - name: effective_from
        tests: [not_null]
      - name: status
        tests: [not_null]

  - name: silver_appointment_slots
    description: Appointment capacity at slot grain. Primary key slot_id.
    columns:
      - name: slot_id
        tests: [not_null, unique]
      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_providers')
                field: provider_id
      - name: slot_date
        tests: [not_null]
      - name: payer_network
        tests: [not_null]

  - name: gold_provider_availability_daily
    description: >
      Fact at slot grain. Primary key slot_id. One row per appointment slot.
      Dimensions used by available_appointments are state, payer_network, and provider_id.
      is_bookable is the only numeric input to careops.metrics.get_metric.
      Network eligibility uses EXISTS, so a second network row does not fan out the fact.
    columns:
      - name: slot_id
        description: Primary key.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_appointment_slots')
                field: slot_id
      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_providers')
                field: provider_id
      - name: state
        description: Dimension.
        tests: [not_null]
      - name: payer_network
        description: Dimension.
        tests: [not_null]
      - name: slot_date
        tests: [not_null]
      - name: is_bookable
        description: Downstream input to metric available_appointments contract version 1.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fanout_appointment_capacity
    description: >
      Defect fixture. Joins each slot to every network row for the same provider and payer.
      slot_id is not a primary key here. This model is not a source for get_metric.
      tests/test_data_product.py asserts that a uniqueness check on this grain fails
      while the authoritative metric stays 42 and 24.
    columns:
      - name: slot_id
        description: Repeated once per matching network row. Uniqueness is expected to fail.
        tests: [not_null]
      - name: network_status
        tests: [not_null]
